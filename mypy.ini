[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = False
disallow_untyped_defs = False
ignore_missing_imports = True
follow_imports = skip
show_error_codes = True
no_implicit_optional = False
strict_optional = False
exclude = rdkit
[mypy-rdkit.*]
ignore_missing_imports = True
ignore_errors = True
follow_imports = skip

[mypy-MDAnalysis.*]
ignore_errors = True

[mypy-gromacs.*]
ignore_errors = True

[mypy-plotly.*]
ignore_errors = True

[mypy-seaborn.*]
ignore_errors = True

[mypy-matplotlib.*]
ignore_errors = True

[mypy-scipy.*]
ignore_errors = True

[mypy-pandas.*]
ignore_errors = True

[mypy-numpy.*]
ignore_errors = True

[mypy-subprocess.*]
ignore_errors = True

[mypy-tempfile.*]
ignore_errors = True